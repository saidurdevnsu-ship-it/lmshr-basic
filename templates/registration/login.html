<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 28rem; margin: 10vh auto; padding: 0 1rem; color: #172033; }
    form { display: grid; gap: .75rem; }
    input { font: inherit; padding: .65rem; border: 1px solid #aab3c2; border-radius: .4rem; }
    button { font: inherit; padding: .7rem; border: 0; border-radius: .4rem; color: white; background: #2457c5; cursor: pointer; }
    .error { color: #a11; }
  </style>
</head>
<body>
  <h1>STS LMS & HR portal Sign in</h1>
  {% if form.errors %}<p class="error">Username or password is incorrect. Please try again.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
